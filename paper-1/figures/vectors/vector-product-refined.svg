<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315ea8"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7252a3"/></marker></defs><rect width="1000" height="600" fill="white"/><text x="52" y="58" font-family="Arial" font-size="27" font-weight="600" fill="#1f2937">Geometric meaning of the vector product</text><text x="52" y="90" font-family="Arial" font-size="17" fill="#6b7280">The vector a × b is normal to the plane of a and b.</text><polygon points="150,420 610,290 820,380 360,510" fill="#eef5fb" stroke="#7896b6" stroke-width="1.4"/><line x1="150" y1="420" x2="610" y2="290" stroke="#315ea8" stroke-width="2.1" marker-end="url(#b)"/><line x1="150" y1="420" x2="360" y2="510" stroke="#a85b43" stroke-width="2.1" marker-end="url(#b)"/><line x1="610" y1="290" x2="820" y2="380" stroke="#a85b43" stroke-width="1.2" stroke-dasharray="7 6"/><line x1="360" y1="510" x2="820" y2="380" stroke="#315ea8" stroke-width="1.2" stroke-dasharray="7 6"/><line x1="485" y1="400" x2="485" y2="150" stroke="#7252a3" stroke-width="2.2" marker-end="url(#p)"/><text x="502" y="172" font-family="Georgia" font-size="25" font-style="italic" fill="#60458d">a × b</text><text x="502" y="198" font-family="Arial" font-size="16" fill="#6b7280">normal to the plane</text><circle cx="150" cy="420" r="4" fill="#374151"/><text x="125" y="453" font-family="Georgia" font-size="24" font-style="italic">O</text><text x="400" y="345" font-family="Georgia" font-size="25" font-style="italic" fill="#315ea8">a</text><text x="245" y="485" font-family="Georgia" font-size="25" font-style="italic" fill="#a85b43">b</text><rect x="620" y="115" width="290" height="112" rx="12" fill="#fafafa" stroke="#d1d5db"/><text x="646" y="148" font-family="Arial" font-size="17" font-weight="600" fill="#374151">Area and direction</text><text x="646" y="181" font-family="Georgia" font-size="22" font-style="italic">|a × b| = parallelogram area</text><text x="646" y="208" font-family="Georgia" font-size="21" font-style="italic">a × b = −(b × a)</text></svg>
