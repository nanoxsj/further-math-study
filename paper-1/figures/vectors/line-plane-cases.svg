<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1400" height="760" rx="30" fill="#f8fafc"/>
  <text x="70" y="62" font-family="Arial" font-size="30" font-weight="700" fill="#172554">A line and a plane: three geometric cases</text>
  <text x="70" y="100" font-family="Arial" font-size="19" fill="#64748b">The dot product d · n determines whether the line changes height in the normal direction.</text>

  <!-- case 1 -->
  <g transform="translate(40 140)">
    <rect width="410" height="540" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="45" font-family="Arial" font-size="23" font-weight="700" fill="#1d4ed8">1. Intersects the plane</text>
    <polygon points="45,360 270,275 370,325 145,420" fill="url(#p)" stroke="#0f766e" stroke-width="3"/>
    <line x1="100" y1="135" x2="300" y2="455" stroke="#dc2626" stroke-width="6" marker-end="url(#a)"/>
    <circle cx="202" cy="298" r="8" fill="#dc2626" stroke="#fff" stroke-width="4"/>
    <text x="218" y="292" font-family="Arial" font-size="20" fill="#b91c1c">intersection</text>
    <text x="35" y="475" font-family="Arial" font-size="19" fill="#334155">d · n ≠ 0</text>
    <text x="35" y="507" font-family="Arial" font-size="18" fill="#475569">one unique intersection</text>
    <text x="35" y="535" font-family="Arial" font-size="17" fill="#64748b">The line has a normal component.</text>
  </g>

  <!-- case 2 -->
  <g transform="translate(495 140)">
    <rect width="410" height="540" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="45" font-family="Arial" font-size="23" font-weight="700" fill="#1d4ed8">2. Parallel to the plane</text>
    <polygon points="45,360 270,275 370,325 145,420" fill="url(#p)" stroke="#0f766e" stroke-width="3"/>
    <line x1="75" y1="170" x2="335" y2="275" stroke="#dc2626" stroke-width="6" marker-end="url(#a)"/>
    <line x1="110" y1="190" x2="110" y2="382" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8"/>
    <line x1="290" y1="263" x2="290" y2="320" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="35" y="475" font-family="Arial" font-size="19" fill="#334155">d · n = 0</text>
    <text x="35" y="507" font-family="Arial" font-size="18" fill="#475569">parallel, no intersection</text>
    <text x="35" y="535" font-family="Arial" font-size="17" fill="#64748b">The line has no normal component.</text>
  </g>

  <!-- case 3 -->
  <g transform="translate(950 140)">
    <rect width="410" height="540" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="45" font-family="Arial" font-size="23" font-weight="700" fill="#1d4ed8">3. Lies in the plane</text>
    <polygon points="45,360 270,275 370,325 145,420" fill="url(#p)" stroke="#0f766e" stroke-width="3"/>
    <line x1="75" y1="390" x2="325" y2="300" stroke="#dc2626" stroke-width="6" marker-end="url(#a)"/>
    <circle cx="150" cy="363" r="7" fill="#dc2626"/><circle cx="270" cy="320" r="7" fill="#dc2626"/>
    <line x1="120" y1="225" x2="120" y2="345" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="35" y="475" font-family="Arial" font-size="19" fill="#334155">d · n = 0</text>
    <text x="35" y="507" font-family="Arial" font-size="18" fill="#475569">parallel and contained</text>
    <text x="35" y="535" font-family="Arial" font-size="17" fill="#64748b">The starting point is on the plane.</text>
  </g>
</svg>
