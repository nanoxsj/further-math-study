<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a85b43"/></marker></defs><rect width="1200" height="600" fill="white"/><text x="45" y="50" font-family="Arial" font-size="27" font-weight="600" fill="#1f2937">A line and a plane</text><text x="45" y="81" font-family="Arial" font-size="17" fill="#6b7280">The value of d · n distinguishes the three cases.</text><g font-family="Arial"><rect x="35" y="120" width="350" height="430" fill="#fff" stroke="#d1d5db"/><text x="58" y="158" font-size="21" font-weight="600" fill="#315ea8">Intersects</text><polygon points="70,365 245,300 345,340 170,410" fill="#eef5fb" stroke="#7896b6"/><line x1="110" y1="205" x2="290" y2="465" stroke="#a85b43" stroke-width="2.5" marker-end="url(#r)"/><circle cx="200" cy="335" r="5" fill="#a85b43"/><text x="58" y="480" font-size="18" fill="#374151">d · n ≠ 0</text><text x="58" y="510" font-size="16" fill="#6b7280">one unique intersection</text><rect x="425" y="120" width="350" height="430" fill="#fff" stroke="#d1d5db"/><text x="448" y="158" font-size="21" font-weight="600" fill="#315ea8">Parallel, separate</text><polygon points="460,365 635,300 735,340 560,410" fill="#eef5fb" stroke="#7896b6"/><line x1="485" y1="220" x2="700" y2="300" stroke="#a85b43" stroke-width="2.5" marker-end="url(#r)"/><line x1="520" y1="250" x2="520" y2="360" stroke="#7252a3" stroke-width="1.5" stroke-dasharray="7 6"/><text x="448" y="480" font-size="18" fill="#374151">d · n = 0</text><text x="448" y="510" font-size="16" fill="#6b7280">no intersection</text><rect x="815" y="120" width="350" height="430" fill="#fff" stroke="#d1d5db"/><text x="838" y="158" font-size="21" font-weight="600" fill="#315ea8">Contained in plane</text><polygon points="850,365 1025,300 1125,340 950,410" fill="#eef5fb" stroke="#7896b6"/><line x1="865" y1="385" x2="1090" y2="315" stroke="#a85b43" stroke-width="2.5" marker-end="url(#r)"/><circle cx="930" cy="365" r="5" fill="#a85b43"/><text x="838" y="480" font-size="18" fill="#374151">d · n = 0</text><text x="838" y="510" font-size="16" fill="#6b7280">starting point lies in plane</text></g></svg>
