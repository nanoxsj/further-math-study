<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A plane, a normal vector and equal normal projections</title>
  <desc id="desc">An oblique translucent plane contains points A and P. The vector r minus a lies in the plane, while n is perpendicular to the plane. Dashed lines show that A and P have the same normal coordinate.</desc>
  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="normal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#172554"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172554">Why does (r − a) · n = 0?</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Every displacement within the plane has zero component in the normal direction.</text>

  <!-- coordinate axes behind the plane -->
  <line x1="160" y1="625" x2="1080" y2="625" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowDark)"/>
  <line x1="160" y1="625" x2="160" y2="175" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowDark)"/>
  <text x="1090" y="632" font-family="Arial, sans-serif" font-size="21" fill="#475569">horizontal directions</text>
  <text x="115" y="170" font-family="Arial, sans-serif" font-size="21" fill="#475569">normal direction</text>

  <!-- plane -->
  <polygon points="245,520 720,355 1060,475 585,650" fill="url(#plane)" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <g stroke="#60a5fa" stroke-width="2" opacity="0.55">
    <line x1="310" y1="497" x2="650" y2="622"/>
    <line x1="400" y1="466" x2="740" y2="591"/>
    <line x1="490" y1="435" x2="830" y2="560"/>
    <line x1="580" y1="404" x2="920" y2="529"/>
    <line x1="670" y1="373" x2="1010" y2="498"/>
    <line x1="345" y1="485" x2="685" y2="355"/>
    <line x1="445" y1="530" x2="785" y2="400"/>
    <line x1="545" y1="575" x2="885" y2="445"/>
    <line x1="645" y1="620" x2="985" y2="490"/>
  </g>
  <text x="825" y="440" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#047857">plane Π</text>

  <!-- points -->
  <circle cx="430" cy="515" r="10" fill="#f97316" stroke="#fff" stroke-width="5"/>
  <circle cx="785" cy="475" r="10" fill="#f97316" stroke="#fff" stroke-width="5"/>
  <text x="398" y="505" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#c2410c">A</text>
  <text x="803" y="466" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#c2410c">P</text>

  <!-- in-plane displacement -->
  <line x1="450" y1="508" x2="765" y2="472" stroke="#172554" stroke-width="6" marker-end="url(#arrowDark)"/>
  <rect x="548" y="452" width="170" height="38" rx="12" fill="#ffffff" fill-opacity="0.92"/>
  <text x="565" y="479" font-family="Georgia, serif" font-size="27" font-style="italic" fill="#172554">r − a</text>
  <text x="520" y="545" font-family="Arial, sans-serif" font-size="20" fill="#475569">movement stays in the plane</text>

  <!-- normal through A and P -->
  <line x1="430" y1="515" x2="430" y2="245" stroke="#7c3aed" stroke-width="5" stroke-dasharray="12 10"/>
  <line x1="785" y1="475" x2="785" y2="205" stroke="#7c3aed" stroke-width="5" stroke-dasharray="12 10"/>
  <line x1="430" y1="245" x2="430" y2="160" stroke="url(#normal)" stroke-width="7" marker-end="url(#arrowPurple)"/>
  <line x1="785" y1="205" x2="785" y2="120" stroke="url(#normal)" stroke-width="7" marker-end="url(#arrowPurple)"/>
  <text x="445" y="225" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#6d28d9">n</text>
  <text x="800" y="185" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#6d28d9">n</text>

  <!-- right angle marks -->
  <path d="M430 495 L450 500 L445 520" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <path d="M785 455 L805 460 L800 480" fill="none" stroke="#7c3aed" stroke-width="3"/>

  <!-- equal projection callout -->
  <rect x="875" y="165" width="255" height="155" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="3" filter="url(#shadow)"/>
  <text x="900" y="205" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#5b21b6">same normal level</text>
  <text x="900" y="247" font-family="Georgia, serif" font-size="27" font-style="italic" fill="#172554">r · n = a · n</text>
  <text x="900" y="286" font-family="Arial, sans-serif" font-size="19" fill="#475569">so (r − a) · n = 0</text>

  <!-- bottom takeaway -->
  <rect x="250" y="680" width="700" height="48" rx="24" fill="#172554"/>
  <text x="600" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">No movement in the normal direction ⇒ equal normal projections</text>
</svg>
