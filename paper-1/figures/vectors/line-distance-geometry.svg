<rect width="1200" height="700" rx="32" fill="#f8fafc"/><text x="65" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#172554">Distances involving two lines</text><text x="65" y="105" font-family="Arial" font-size="20" fill="#64748b">For skew lines, the shortest distance is measured along their common perpendicular.</text><polygon points="190,510 730,330 1035,450 495,630" fill="url(#strip)" stroke="#94a3b8" stroke-width="3" opacity="0.72"/>
