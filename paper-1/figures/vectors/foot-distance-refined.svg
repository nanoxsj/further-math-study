<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7252a3"/></marker></defs><rect width="1000" height="560" fill="white"/><text x="52" y="58" font-family="Arial" font-size="27" font-weight="600" fill="#1f2937">Foot of a perpendicular and distance to a plane</text><text x="52" y="90" font-family="Arial" font-size="17" fill="#6b7280">The shortest segment from P to the plane is normal to the plane.</text><polygon points="130,390 625,240 875,340 380,490" fill="#eef5fb" stroke="#7896b6" stroke-width="1.4"/><g stroke="#9bb8d4" stroke-width="0.8" stroke-dasharray="5 5"><line x1="225" y1="361" x2="480" y2="461"/><line x1="325" y1="331" x2="580" y2="431"/><line x1="425" y1="301" x2="680" y2="401"/><line x1="525" y1="271" x2="780" y2="371"/></g><line x1="500" y1="145" x2="500" y2="365" stroke="#7252a3" stroke-width="2.4" marker-end="url(#p)"/><circle cx="500" cy="145" r="7" fill="#a85b43"/><circle cx="500" cy="365" r="6" fill="#7252a3"/><text x="518" y="140" font-family="Georgia" font-size="24" font-style="italic" fill="#a85b43">P</text><text x="518" y="375" font-family="Georgia" font-size="24" font-style="italic" fill="#60458d">H</text><text x="520" y="255" font-family="Georgia" font-size="25" font-style="italic" fill="#60458d">n</text><path d="M500 365l28 -9l9 28" fill="none" stroke="#7252a3" stroke-width="1.3"/><text x="570" y="330" font-family="Arial" font-size="17" fill="#60458d">PH ⟂ plane</text><rect x="115" y="445" width="455" height="65" rx="10" fill="#fafafa" stroke="#d1d5db"/><text x="140" y="487" font-family="Georgia" font-size="22" font-style="italic">D = |p − p₀ · n| / |n|</text><text x="615" y="475" font-family="Arial" font-size="17" fill="#6b7280">PH is the shortest distance</text></svg>
