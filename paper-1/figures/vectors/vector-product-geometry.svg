<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs><linearGradient id="area" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ea580c"/></marker><marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker></defs>
<rect width="1200" height="700" rx="32" fill="#f8fafc"/><text x="65" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#172554">Geometric meaning of a × b</text><text x="65" y="105" font-family="Arial" font-size="20" fill="#64748b">The vector product is perpendicular to both vectors and measures the area they span.</text>
<polygon points="210,530 760,375 1000,475 450,630" fill="url(#area)" stroke="#0f766e" stroke-width="4"/><line x1="210" y1="530" x2="760" y2="375" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><line x1="210" y1="530" x2="450" y2="630" stroke="#ea580c" stroke-width="7" marker-end="url(#orange)"/><line x1="760" y1="375" x2="1000" y2="475" stroke="#ea580c" stroke-width="5" stroke-dasharray="10 8"/><line x1="450" y1="630" x2="1000" y2="475" stroke="#2563eb" stroke-width="5" stroke-dasharray="10 8"/>
<circle cx="210" cy="530" r="10" fill="#172554"/><text x="185" y="565" font-family="Georgia" font-size="28" font-style="italic" fill="#172554">O</text><text x="500" y="450" font-family="Georgia" font-size="30" font-style="italic" fill="#1d4ed8">a</text><text x="310" y="620" font-family="Georgia" font-size="30" font-style="italic" fill="#c2410c">b</text><text x="555" y="555" font-family="Arial" font-size="24" font-weight="700" fill="#047857">parallelogram area = |a × b|</text>
<line x1="600" y1="520" x2="600" y2="170" stroke="#7c3aed" stroke-width="8" marker-end="url(#purple)"/><text x="625" y="210" font-family="Georgia" font-size="30" font-style="italic" fill="#6d28d9">a × b</text><text x="625" y="245" font-family="Arial" font-size="19" fill="#475569">perpendicular to the plane</text><rect x="790" y="145" width="315" height="150" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="3"/><text x="820" y="185" font-family="Arial" font-size="21" font-weight="700" fill="#5b21b6">Right-hand rule</text><text x="820" y="227" font-family="Georgia" font-size="25" font-style="italic" fill="#172554">a × b = −(b × a)</text><text x="820" y="263" font-family="Arial" font-size="18" fill="#475569">reversing the order reverses direction</text></svg>
