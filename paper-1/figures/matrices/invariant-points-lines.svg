<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Invariant point and invariant line</title>
  <desc id="desc">An invariant point stays fixed and vectors on an invariant line remain on the same line.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="720" height="360" fill="#f8fafc"/>
  <line x1="70" y1="285" x2="680" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <line x1="365" y1="325" x2="365" y2="45" stroke="#94a3b8" stroke-width="2"/>
  <line x1="95" y1="300" x2="630" y2="85" stroke="#0f766e" stroke-width="4"/>
  <circle cx="500" cy="120" r="7" fill="#dc2626"/>
  <line x1="500" y1="120" x2="560" y2="96" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="500" y2="285" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="500" cy="120" r="16" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="115" font-size="18" fill="#dc2626">fixed point: Mx = x</text>
  <text x="120" y="75" font-size="18" fill="#0f766e">invariant line: direction is preserved</text>
  <text x="515" y="260" font-size="17" fill="#f59e0b">same line after transformation</text>
</svg>
