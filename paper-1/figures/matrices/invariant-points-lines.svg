<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Invariant point and invariant line</title><desc id="desc">A coordinate grid shows a fixed point and a line mapped onto itself.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315ea8"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7252a3"/></marker><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#dbe4ef" stroke-width="0.8"/></pattern></defs>
<rect width="900" height="430" fill="#fff"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="600" fill="#1f2937">Invariant point and invariant line</text><text x="40" y="70" font-family="Arial" font-size="17" fill="#6b7280">A fixed point stays fixed; an invariant line maps onto itself.</text>
<rect x="45" y="95" width="530" height="280" fill="url(#g)" stroke="#9bb8d4"/><line x1="75" y1="325" x2="545" y2="325" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="355" x2="175" y2="115" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/><line x1="65" y1="345" x2="535" y2="125" stroke="#315ea8" stroke-width="2.2"/><text x="405" y="135" font-family="Georgia" font-size="23" font-style="italic" fill="#315ea8">invariant line ℓ</text>
<circle cx="315" cy="228" r="7" fill="#a85b43" stroke="#fff" stroke-width="3"/><circle cx="315" cy="228" r="15" fill="none" stroke="#a85b43" stroke-width="1" stroke-dasharray="4 4"/><text x="332" y="222" font-family="Georgia" font-size="22" font-style="italic" fill="#a85b43">P = P′</text><text x="332" y="248" font-family="Arial" font-size="15" fill="#6b7280">invariant point</text><line x1="235" y1="267" x2="285" y2="244" stroke="#7252a3" stroke-width="2" marker-end="url(#p)"/><line x1="385" y1="195" x2="435" y2="172" stroke="#7252a3" stroke-width="2" marker-end="url(#p)"/>
<rect x="620" y="105" width="235" height="245" rx="12" fill="#fafafa" stroke="#d1d5db"/><text x="647" y="142" font-family="Arial" font-size="19" font-weight="600" fill="#315ea8">Conditions</text><text x="647" y="190" font-family="Georgia" font-size="23" font-style="italic">MP = P</text><text x="647" y="216" font-family="Arial" font-size="15" fill="#6b7280">fixed point</text><text x="647" y="268" font-family="Georgia" font-size="23" font-style="italic">Mv = λv</text><text x="647" y="294" font-family="Arial" font-size="15" fill="#6b7280">invariant direction</text><text x="647" y="325" font-family="Arial" font-size="15" fill="#6b7280">line maps onto itself</text></svg>
