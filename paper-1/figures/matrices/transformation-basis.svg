<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">A matrix maps the standard basis vectors</title>
  <desc id="desc">The standard basis vectors are mapped to the columns of a two by two matrix.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="720" height="360" fill="#f8fafc"/>
  <line x1="55" y1="285" x2="310" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <line x1="75" y1="315" x2="75" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="285" x2="680" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="315" x2="430" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <text x="148" y="42" font-size="20" fill="#0f172a">Before: standard basis</text>
  <text x="490" y="42" font-size="20" fill="#0f172a">After applying M</text>
  <line x1="75" y1="285" x2="205" y2="285" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="285" x2="75" y2="165" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="430" y1="285" x2="570" y2="190" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="430" y1="285" x2="510" y2="120" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="190" y="305" font-size="18" fill="#2563eb">e₁</text>
  <text x="82" y="160" font-size="18" fill="#dc2626">e₂</text>
  <text x="565" y="185" font-size="17" fill="#2563eb">M e₁ = first column</text>
  <text x="515" y="112" font-size="17" fill="#dc2626">M e₂ = second column</text>
</svg>
