<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">A matrix maps the standard basis vectors to its columns</title><desc id="desc">Before and after coordinate grids show the two standard basis vectors and their images under a matrix.</desc>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315ea8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a85b43"/></marker><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#dbe4ef" stroke-width="0.8"/></pattern></defs>
<rect width="900" height="430" fill="#fff"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="600" fill="#1f2937">Basis vectors and the columns of M</text>
<rect x="45" y="78" width="340" height="270" fill="url(#g)" stroke="#9bb8d4"/><rect x="515" y="78" width="340" height="270" fill="url(#g)" stroke="#9bb8d4"/>
<text x="68" y="112" font-family="Arial" font-size="19" font-weight="600" fill="#315ea8">Before: standard basis</text><text x="538" y="112" font-family="Arial" font-size="19" font-weight="600" fill="#315ea8">After applying M</text>
<line x1="215" y1="295" x2="325" y2="295" stroke="#315ea8" stroke-width="2" marker-end="url(#b)"/><line x1="215" y1="295" x2="215" y2="180" stroke="#a85b43" stroke-width="2" marker-end="url(#o)"/><text x="315" y="288" font-family="Georgia" font-size="22" font-style="italic" fill="#315ea8">e₁</text><text x="225" y="178" font-family="Georgia" font-size="22" font-style="italic" fill="#a85b43">e₂</text>
<line x1="685" y1="295" x2="790" y2="225" stroke="#315ea8" stroke-width="2" marker-end="url(#b)"/><line x1="685" y1="295" x2="745" y2="155" stroke="#a85b43" stroke-width="2" marker-end="url(#o)"/><text x="758" y="222" font-family="Georgia" font-size="20" font-style="italic" fill="#315ea8">Me₁</text><text x="750" y="150" font-family="Georgia" font-size="20" font-style="italic" fill="#a85b43">Me₂</text>
<rect x="300" y="365" width="300" height="42" rx="9" fill="#fafafa" stroke="#d1d5db"/><text x="350" y="393" font-family="Georgia" font-size="22" font-style="italic" fill="#1f2937">M = [ Me₁  Me₂ ]</text></svg>
